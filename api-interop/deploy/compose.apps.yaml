# แอปทั้งสาม + volume ข้อมูล: ใช้ร่วมกันโดย compose.yaml (Caddy + Let's Encrypt + basic auth) และ compose.tunnel.yaml (Cloudflare Tunnel)
# ผ่าน include: ไม่รันไฟล์นี้ตรง ๆ
# - แอปอยู่ใน network ภายในของ compose เท่านั้น ข้อมูลอยู่ใน named volume (README หัวข้อ "ย้ายข้อมูลเดิมขึ้น") ไม่อยู่ใน image

x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # เตรียม volume ครั้งแรก (root ครั้งเดียวแล้วจบ): ให้รากของทุก volume เป็นของ uid 10001 และสร้าง orbits/_cache ใน gnss_data
  # ก่อน Docker สร้างจุด mount ของ celestrak_cache (ไม่งั้นโฟลเดอร์ orbits/ เป็นของ root และ GNSS Studio เขียนไม่ได้)
  # ไม่ chown -R: ข้อมูลที่ย้ายขึ้นด้วย seed-volume.sh เป็นของ 10001 อยู่แล้ว
  init-volumes:
    image: ${EO_STUDIO_IMAGE:-eo-studio:prod}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        mkdir -p /v/gnss/orbits/_cache;
        chown 10001:10001 /v/gnss /v/gnss/orbits /v/gnss/orbits/_cache /v/gpredict /v/eo /v/cache;
        echo init-volumes: ok
    # CHOWN: เปลี่ยนเจ้าของ / DAC_OVERRIDE: สร้างโฟลเดอร์ใน volume ที่เป็นของ 10001 แล้ว (ย้ายข้อมูลขึ้นด้วย seed-volume.sh)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - "no-new-privileges:true"
    network_mode: none
    restart: "no"
    volumes:
      - gnss_data:/v/gnss
      - gpredict_data:/v/gpredict
      - eo_data:/v/eo
      - celestrak_cache:/v/cache

  gnss-studio:
    <<: *hardening
    image: ${GNSS_STUDIO_IMAGE:-gnss-studio:prod}
    environment:
      GNSS_STUDIO_PORT: "8000"
      GNSS_STUDIO_GPREDICT_DATA: "/gpredict-data"
      CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    volumes:
      - gnss_data:/data
      # read-only เพื่อให้ GNSS Studio ดึงรายชื่อดาว 17,071 ดวงของ Gpredict Web ได้โดยไม่แก้ไฟล์ของ Gpredict
      - gpredict_data:/gpredict-data:ro
      - celestrak_cache:/data/orbits/_cache
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  gpredict-web:
    <<: *hardening
    image: ${GPREDICT_WEB_IMAGE:-gpredict-web:prod}
    environment:
      GPREDICT_WEB_PORT: "8740"
    # rigctld/rotctld บนเครื่อง host: ตั้ง Host ใน Preferences → Interfaces เป็น host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gpredict_data:/data
      - celestrak_cache:/engine-data/orbits/_cache
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  eo-studio:
    <<: *hardening
    image: ${EO_STUDIO_IMAGE:-eo-studio:prod}
    volumes:
      - eo_data:/data
    # worker ประมวลผล SAR/YOLO ใช้หน่วยความจำมาก จำกัดไว้ไม่ให้กินเครื่องจนแอปอื่นล้ม (ปรับใน .env)
    mem_limit: ${EO_STUDIO_MEM_LIMIT:-8g}
    depends_on:
      init-volumes:
        condition: service_completed_successfully

volumes:
  gnss_data:
  gpredict_data:
  eo_data:
  celestrak_cache:
